<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" class="s" role="img" aria-label="每任务成本：按访问模式切分，中间是一份提示协议">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#8a8984}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.lnd{stroke:#9b9a95;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.soft{fill:#f3f2ef}.lane{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.m3{fill:#1baf7a}.m4{fill:#8a63d2}.m5{fill:#7f8fa6}.m6{fill:#b5b0a2}
.b1{fill:#2a78d6;fill-opacity:.12;stroke:#2a78d6;stroke-width:1.3}.b2{fill:#eb6834;fill-opacity:.12;stroke:#eb6834;stroke-width:1.3}
.b3{fill:#1baf7a;fill-opacity:.12;stroke:#1baf7a;stroke-width:1.3}.b5{fill:#7f8fa6;fill-opacity:.12;stroke:#7f8fa6;stroke-width:1.3}
.ah{fill:#9b9a95}.yr{stroke:#e3e1da;stroke-width:1}.hl{fill:#eb6834;fill-opacity:.07}
@media (prefers-color-scheme:dark){.bg,.box{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.soft,.lane{fill:#242422}
.ln,.lnd,.box{stroke:#6d6c66}.ah{fill:#6d6c66}.yr{stroke:#2e2e2b}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{fill:#d95926;fill-opacity:.10}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title>每任务成本：按访问模式切分，中间是一份提示协议</title>
<rect class="bg" width="960" height="400" rx="8"/>
<text class="t1" x="24" y="32" font-size="18" font-weight="600">每任务成本：按访问模式切分，中间是一份提示协议</text>
<text class="t2" x="24" y="54" font-size="12.5">逐 token 的留在引擎；I/O 型的放到旁边；两边约定会话与 KV 的生命周期</text>
<rect class="b5" x="24.0" y="80.0" width="272.0" height="150.0" rx="7"/>
<text class="t1" x="40.0" y="106.0" font-size="13.5" text-anchor="start" font-weight="600">Harness / agent</text>
<text class="t2" x="40.0" y="134.0" font-size="12" text-anchor="start">• 工具调用、等待</text>
<text class="t2" x="40.0" y="158.0" font-size="12" text-anchor="start">• 对话历史、子 agent</text>
<text class="t2" x="40.0" y="182.0" font-size="12" text-anchor="start">• 前缀稳定性纪律</text>
<rect class="b3" x="344.0" y="80.0" width="272.0" height="150.0" rx="7"/>
<text class="t1" x="360.0" y="106.0" font-size="13.5" text-anchor="start" font-weight="600">网关（如 SMG）</text>
<text class="t2" x="360.0" y="134.0" font-size="12" text-anchor="start">• Responses / MCP 状态</text>
<text class="t2" x="360.0" y="158.0" font-size="12" text-anchor="start">• 会话粘性路由</text>
<text class="t2" x="360.0" y="182.0" font-size="12" text-anchor="start">• 分词、解析</text>
<rect class="b1" x="664.0" y="80.0" width="272.0" height="150.0" rx="7"/>
<text class="t1" x="680.0" y="106.0" font-size="13.5" text-anchor="start" font-weight="600">引擎（vLLM、SGLang、芯片运行时）</text>
<text class="t2" x="680.0" y="134.0" font-size="12" text-anchor="start">• 语法掩码、采样</text>
<text class="t2" x="680.0" y="158.0" font-size="12" text-anchor="start">• KV 驻留与淘汰</text>
<text class="t2" x="680.0" y="182.0" font-size="12" text-anchor="start">• 批处理与调度</text>
<path class="ln" d="M296,155 L344,155" marker-end="url(#ar)"/>
<path class="ln" d="M616,155 L664,155" marker-end="url(#ar)"/>
<rect class="soft" x="24.0" y="254.0" width="912.0" height="92.0" rx="7"/>
<text class="t1" x="40.0" y="280.0" font-size="13" text-anchor="start" font-weight="600">提示与 KV 生命周期协议（可选字段，请求格式不变）</text>
<text class="t2" x="40.0" y="306.0" font-size="12.5" text-anchor="start">session / parent ID · 优先级 · 预计输出长度 · 缓存 TTL · Pin / Retain / Prefetch</text>
<text class="t3" x="40.0" y="330.0" font-size="11.5" text-anchor="start">实现与提议（不是一份已互通的协议）：vLLM 路线图、Dynamo agent hints、llm-d 1.0；提案 SGLang #27574（已关闭）、vLLM #51428（开放中）</text>
<text class="t3" x="24.0" y="384.0" font-size="11" text-anchor="start">来源见文末；Dynamo 的两组测试基线不同：程序级调度多出约 12–16%（SWE-bench）和 11.0–14.6%（RL rollout，中并发）。</text>
</svg>