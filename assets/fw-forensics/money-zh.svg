<rect x="196" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="234" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="248" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="248" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="286" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="300" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="300" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="338" y="130" width="14" height="10" fill="#d0cec6"/>
