<rect x="456" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="494" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="508" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="508" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="546" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="560" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="560" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="598" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="612" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="612" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="650" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="664" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="664" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="702" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="716" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="716" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<text class="t2" x="774.0" y="142.0" font-size="18" text-anchor="start">…</text>
<text class="t2" x="40.0" y="188.0" font-size="11" text-anchor="start">灰块：读进的上下文（大多命中缓存）  橙条：写出的 token  浅灰：工具调用的等待（中位 3.84 秒，约 1/10 超过 1 分钟）</text>
<text x="40" y="208" font-size="11.5" font-weight="700" fill="#cf222e">红块：工具等待时缓存断掉，前缀按缓存写重新计费，约等于 20–40 次缓存读的钱</text>
<text class="t1" x="40.0" y="258.0" font-size="12" text-anchor="start" font-weight="700">五个选定的 SWE-bench Verified 任务（Kimi K3，按标价，低思考强度）</text>
<text class="t1" x="40.0" y="316.0" font-size="13" text-anchor="start" font-weight="700">token 占比</text>
<rect x="170.0" y="286" width="44.9" height="46" fill="#7f8fa6" fill-opacity=".85"/>
<text class="t1" x="192.4" y="282.0" font-size="11" text-anchor="middle" font-weight="700">6.6%</text>
<rect x="214.9" y="286" width="611.3" height="46" fill="#2a78d6" fill-opacity=".85"/>
<text x="520.5" y="306" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">89.9%</text>
<text x="520.5" y="322" font-size="10.5" fill="#fff" text-anchor="middle">缓存命中的输入</text>
<rect x="826.2" y="286" width="24.5" height="46" fill="#eb6834" fill-opacity=".85"/>
<text class="t1" x="838.4" y="282.0" font-size="11" text-anchor="middle" font-weight="700">3.6%</text>
<text class="t1" x="40.0" y="392.0" font-size="13" text-anchor="start" font-weight="700">美元占比</text>
<rect x="170.0" y="362" width="133.3" height="46" fill="#7f8fa6" fill-opacity=".85"/>
<text x="236.6" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">19.6%</text>
<text x="236.6" y="398" font-size="10.5" fill="#fff" text-anchor="middle">新输入</text>
<rect x="303.3" y="362" width="182.2" height="46" fill="#2a78d6" fill-opacity=".85"/>
<text x="394.4" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">26.8%</text>
<text x="394.4" y="398" font-size="10.5" fill="#fff" text-anchor="middle">缓存命中的输入</text>
<rect x="485.5" y="362" width="364.5" height="46" fill="#eb6834" fill-opacity=".85"/>
<text x="667.8" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">53.6%</text>
<text x="667.8" y="398" font-size="10.5" fill="#fff" text-anchor="middle">输出</text>
<path d="M826.2,332 L485.5,362" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<path d="M850.0,332 L850.0,362" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<rect class="soft" x="40.0" y="450.0" width="840.0" height="140.0" rx="7"/>
<text class="t1" x="58.0" y="478.0" font-size="12.5" text-anchor="start" font-weight="600">读得多、写得少：输出只占约 3% 的 token，却占一半以上的钱；缓存命中的输入占九成 token，只占四分之一的钱。</text>
<text class="t1" x="58.0" y="514.0" font-size="12.5" text-anchor="start" font-weight="600">所以账单很大程度上取决于缓存能不能在工具等待期间活下来，而不只是每秒多少 token。</text>
<text class="t2" x="58.0" y="550.0" font-size="11.5" text-anchor="start">同一篇论文：每次运行的中位成本 0.11–1.16 美元；缓存命中率 96.3%。</text>
<text class="t3" x="24.0" y="610.0" font-size="10.5" text-anchor="start">来源：SemiAnalysis AgentX（会话中位数）；Smékal，arXiv 2608.25399，表 E1（token 与美元占比）；CONCUR，arXiv 2601.22705（重算占延迟）。</text>
<text class="t3" x="24.0" y="626.0" font-size="10.5" text-anchor="start">「20–40 次缓存读」按缓存读 5%、写 125–200% 的输入价粗算，是本文的估算；比例依赖价格和缓存条件。上方会话条为示意。</text>
</svg>