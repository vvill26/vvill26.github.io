<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" class="s" role="img" aria-label="The unit of value is moving up: engines have reached sessions, not tasks">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#8a8984}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.lnd{stroke:#9b9a95;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.soft{fill:#f3f2ef}.lane{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.m3{fill:#1baf7a}.m4{fill:#8a63d2}.m5{fill:#7f8fa6}.m6{fill:#b5b0a2}
.b1{fill:#2a78d6;fill-opacity:.12;stroke:#2a78d6;stroke-width:1.3}.b2{fill:#eb6834;fill-opacity:.12;stroke:#eb6834;stroke-width:1.3}
.b3{fill:#1baf7a;fill-opacity:.12;stroke:#1baf7a;stroke-width:1.3}.b5{fill:#7f8fa6;fill-opacity:.12;stroke:#7f8fa6;stroke-width:1.3}
.ah{fill:#9b9a95}.yr{stroke:#e3e1da;stroke-width:1}.hl{fill:#eb6834;fill-opacity:.07}
@media (prefers-color-scheme:dark){.bg,.box{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.soft,.lane{fill:#242422}
.ln,.lnd,.box{stroke:#6d6c66}.ah{fill:#6d6c66}.yr{stroke:#2e2e2b}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{fill:#d95926;fill-opacity:.10}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title>The unit of value is moving up: engines have reached sessions, not tasks</title>
<rect class="bg" width="940" height="560" rx="8"/>
<text class="t1" x="24" y="32" font-size="18" font-weight="600">The unit of value is moving up: engines have reached sessions, not tasks</text>
<text class="t2" x="24" y="54" font-size="12.5">One chain: each step to the right optimizes a bigger unit. Solid is where work exists today; dashed is still open</text>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#eb6834" stroke-opacity=".35" stroke-width="3"/></pattern></defs>
<polygon points="36.0,150.0 248.0,150.0 266.0,187.0 248.0,224.0 36.0,224.0" fill="#7f8fa6" fill-opacity="0.30" stroke="#fbfaf6" stroke-width="3"/>
<text x="142.0" y="195.0" font-size="24" font-weight="800" fill="#24292f" text-anchor="middle">token</text>
<text class="t1" x="142.0" y="268.0" font-size="12" text-anchor="middle" font-weight="600">tokens per second,</text>
<text class="t1" x="142.0" y="284.0" font-size="12" text-anchor="middle" font-weight="600">dollars per token</text>
<text class="t2" x="142.0" y="334.0" font-size="11" text-anchor="middle">kernels, decode loop,</text>
<text class="t2" x="142.0" y="349.0" font-size="11" text-anchor="middle">quantization; every chip</text>
<line x1="257.0" y1="250" x2="257.0" y2="374" stroke="#d8d4c8" stroke-dasharray="2 4"/>
<polygon points="248.0,150.0 460.0,150.0 478.0,187.0 460.0,224.0 248.0,224.0 266.0,187.0" fill="#1baf7a" fill-opacity="0.44" stroke="#fbfaf6" stroke-width="3"/>
<text x="363.0" y="195.0" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">request</text>
<text class="t1" x="363.0" y="268.0" font-size="12" text-anchor="middle" font-weight="600">batching, prefill/decode</text>
<text class="t1" x="363.0" y="284.0" font-size="12" text-anchor="middle" font-weight="600">split, per-request routing</text>
<text class="t2" x="363.0" y="334.0" font-size="11" text-anchor="middle">Orca → vLLM, SGLang,</text>
<text class="t2" x="363.0" y="349.0" font-size="11" text-anchor="middle">TensorRT-LLM</text>
<line x1="469.0" y1="250" x2="469.0" y2="374" stroke="#d8d4c8" stroke-dasharray="2 4"/>
<polygon points="460.0,150.0 672.0,150.0 690.0,187.0 672.0,224.0 460.0,224.0 478.0,187.0" fill="#2a78d6" fill-opacity="0.58" stroke="#fbfaf6" stroke-width="3"/>
<text x="575.0" y="195.0" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">session</text>
<text class="t1" x="575.0" y="268.0" font-size="12" text-anchor="middle" font-weight="600">prefix cache, session IDs,</text>
<text class="t1" x="575.0" y="284.0" font-size="12" text-anchor="middle" font-weight="600">KV tiers and retention</text>
<text class="t2" x="575.0" y="334.0" font-size="11" text-anchor="middle">vLLM Q3 2026 roadmap,</text>
<text class="t2" x="575.0" y="349.0" font-size="11" text-anchor="middle">Dynamo hints, llm-d 1.0</text>
<line x1="681.0" y1="250" x2="681.0" y2="374" stroke="#d8d4c8" stroke-dasharray="2 4"/>
<polygon points="672.0,150.0 884.0,150.0 902.0,187.0 884.0,224.0 672.0,224.0 690.0,187.0" fill="url(#hatch)" stroke="#eb6834" stroke-width="2" stroke-dasharray="7 5"/>
<text x="787.0" y="195.0" font-size="24" font-weight="800" fill="#eb6834" text-anchor="middle">task</text>
<text class="t1" x="787.0" y="268.0" font-size="12" text-anchor="middle" font-weight="600">dollars and time per</text>
<text class="t1" x="787.0" y="284.0" font-size="12" text-anchor="middle" font-weight="600">finished task</text>
<text class="t2" x="787.0" y="334.0" font-size="11" text-anchor="middle">Claude Code, Codex, Cognition</text>
<text class="t2" x="787.0" y="349.0" font-size="11" text-anchor="middle">(harness side, not engines)</text>
<text class="t3" x="36.0" y="248.0" font-size="10.5" text-anchor="start" font-weight="700">What gets optimized</text>
<text class="t3" x="36.0" y="316.0" font-size="10.5" text-anchor="start" font-weight="700">Who works here today</text>
<rect x="42.0" y="104" width="200" height="24" rx="12" fill="#52514e"/>
<text x="142.0" y="120" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">billed here today (S-1)</text>
<line x1="142.0" y1="128" x2="142.0" y2="148" stroke="#52514e" stroke-width="1.6"/>
<rect x="692.0" y="104" width="190" height="24" rx="12" fill="#eb6834"/>
<text x="787.0" y="120" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">value is measured here</text>
<line x1="787.0" y1="128" x2="787.0" y2="148" stroke="#eb6834" stroke-width="1.6"/>
<line x1="681.0" y1="132" x2="681.0" y2="242" stroke="#2a78d6" stroke-width="2.4"/>
<rect x="589.0" y="226" width="184" height="22" rx="11" fill="#2a78d6"/>
<text x="681.0" y="241" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">open engines have reached here</text>
<path d="M480,384 L480,374 L902,374 L902,384" fill="none" stroke="#cf222e" stroke-width="1.6"/>
<rect x="480" y="388" width="422" height="84" rx="8" fill="#cf222e" fill-opacity=".06" stroke="#cf222e" stroke-dasharray="6 4"/>
<text x="494" y="410" font-size="13" font-weight="700" fill="#cf222e">The gap: the contract between session and task</text>
<text class="t1" x="494.0" y="430.0" font-size="11.5" text-anchor="start">a hint protocol and KV-lifetime contract between harness and engine</text>
<text class="t2" x="494.0" y="448.0" font-size="10.5" text-anchor="start">(session and parent IDs, priority, cache TTL, Pin / Retain / Prefetch)</text>
<text class="t2" x="24.0" y="530.0" font-size="11" text-anchor="start">Counter-evidence: in two Dynamo tests with different baselines, program-level scheduling added only ~12–16% (SWE-bench, vs KV-aware routing) and 11.0–14.6% (RL rollout).</text>
<text class="t3" x="24.0" y="546.0" font-size="10.5" text-anchor="start">Sources: Anthropic S-1; a16z, "Welcome to the B2A Economy"; vLLM #48168; PyTorch blog (Dynamo session awareness); llm-d 1.0 (see Sources).</text>
</svg>