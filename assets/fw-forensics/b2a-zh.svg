<text class="t3" x="24.0" y="530.0" font-size="11" text-anchor="start">来源：a16z《Welcome to the B2A Economy》（2026.11.11）文中引用的 GitHub、Supabase、Stripe、Vercel、Shopify、Human Security 数据；</text>
<text class="t3" x="24.0" y="546.0" font-size="11" text-anchor="start">Anthropic S-1（SEC EDGAR）。图为本文根据这些数字重画，不是原图。</text>
