<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" class="s" role="img" aria-label="The ten axes form a map">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#8a8984}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.lnd{stroke:#9b9a95;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.soft{fill:#f3f2ef}.lane{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.m3{fill:#1baf7a}.m4{fill:#8a63d2}.m5{fill:#7f8fa6}.m6{fill:#b5b0a2}
.b1{fill:#2a78d6;fill-opacity:.12;stroke:#2a78d6;stroke-width:1.3}.b2{fill:#eb6834;fill-opacity:.12;stroke:#eb6834;stroke-width:1.3}
.b3{fill:#1baf7a;fill-opacity:.12;stroke:#1baf7a;stroke-width:1.3}.b5{fill:#7f8fa6;fill-opacity:.12;stroke:#7f8fa6;stroke-width:1.3}
.ah{fill:#9b9a95}.yr{stroke:#e3e1da;stroke-width:1}.hl{fill:#eb6834;fill-opacity:.07}
@media (prefers-color-scheme:dark){.bg,.box{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.soft,.lane{fill:#242422}
.ln,.lnd,.box{stroke:#6d6c66}.ah{fill:#6d6c66}.yr{stroke:#2e2e2b}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{fill:#d95926;fill-opacity:.10}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title>The ten axes form a map</title>
<rect class="bg" width="900" height="600" rx="8"/>
<text class="t1" x="24" y="32" font-size="18" font-weight="600">The ten axes form a map</text>
<text class="t2" x="24" y="54" font-size="12.5">Correlated axes sit together; dashed lines join the two strongest negative correlations</text>
<path d="M450,320 L388.8,131.7 A198,198 0 0 1 648.0,320.0 Z" fill="#2a78d6" fill-opacity=".10" stroke="#2a78d6" stroke-opacity=".5"/>
<text x="617.5" y="89.4" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="start">the vLLM / SGLang side</text>
<path d="M450,320 L648.0,320.0 A198,198 0 0 1 388.8,508.3 Z" fill="#eb6834" fill-opacity=".10" stroke="#eb6834" stroke-opacity=".5"/>
<text x="617.5" y="550.6" font-size="13" font-weight="700" fill="#eb6834" text-anchor="start">the llama.cpp and edge side</text>
<path d="M450,320 L388.8,508.3 A198,198 0 0 1 252.0,320.0 Z" fill="#8a63d2" fill-opacity=".10" stroke="#8a63d2" stroke-opacity=".5"/>
<text x="219.4" y="487.5" font-size="13" font-weight="700" fill="#8a63d2" text-anchor="end">the chip-vendor side</text>
<path d="M450,320 L252.0,320.0 A198,198 0 0 1 388.8,131.7 Z" fill="#1baf7a" fill-opacity=".10" stroke="#1baf7a" stroke-opacity=".5"/>
<text x="219.4" y="152.5" font-size="13" font-weight="700" fill="#1baf7a" text-anchor="end">the scheduling and fleet side</text>
<line class="ln" x1="450" y1="320" x2="450.0" y2="130.0"/>
<circle cx="450.0" cy="130.0" r="5" fill="#52514e"/>
<text class="t1" x="450.0" y="112.0" font-size="12.5" text-anchor="middle" font-weight="600">Memory</text>
<line class="ln" x1="450" y1="320" x2="561.7" y2="166.3"/>
<circle cx="561.7" cy="166.3" r="5" fill="#52514e"/>
<text class="t1" x="574.6" y="152.5" font-size="12.5" text-anchor="start" font-weight="600">Program</text>
<line class="ln" x1="450" y1="320" x2="630.7" y2="261.3"/>
<circle cx="630.7" cy="261.3" r="5" fill="#52514e"/>
<text class="t1" x="651.6" y="258.5" font-size="12.5" text-anchor="start" font-weight="600">Breadth</text>
<line class="ln" x1="450" y1="320" x2="630.7" y2="378.7"/>
<circle cx="630.7" cy="378.7" r="5" fill="#52514e"/>
<text class="t1" x="651.6" y="389.5" font-size="12.5" text-anchor="start" font-weight="600">Host path</text>
<line class="ln" x1="450" y1="320" x2="561.7" y2="473.7"/>
<circle cx="561.7" cy="473.7" r="5" fill="#52514e"/>
<text class="t1" x="574.6" y="495.5" font-size="12.5" text-anchor="start" font-weight="600">Portability</text>
<line class="ln" x1="450" y1="320" x2="450.0" y2="510.0"/>
<circle cx="450.0" cy="510.0" r="5" fill="#52514e"/>
<text class="t1" x="450.0" y="536.0" font-size="12.5" text-anchor="middle" font-weight="600">Device</text>
<line class="ln" x1="450" y1="320" x2="338.3" y2="473.7"/>
<circle cx="338.3" cy="473.7" r="5" fill="#52514e"/>
<text class="t1" x="325.4" y="495.5" font-size="12.5" text-anchor="end" font-weight="600">Compiler</text>
<line class="ln" x1="450" y1="320" x2="269.3" y2="378.7"/>
<circle cx="269.3" cy="378.7" r="5" fill="#52514e"/>
<text class="t1" x="248.4" y="389.5" font-size="12.5" text-anchor="end" font-weight="600">Vertical</text>
<line class="ln" x1="450" y1="320" x2="269.3" y2="261.3"/>
<circle cx="269.3" cy="261.3" r="5" fill="#52514e"/>
<text class="t1" x="248.4" y="258.5" font-size="12.5" text-anchor="end" font-weight="600">Fleet</text>
<line class="ln" x1="450" y1="320" x2="338.3" y2="166.3"/>
<circle cx="338.3" cy="166.3" r="5" fill="#52514e"/>
<text class="t1" x="325.4" y="152.5" font-size="12.5" text-anchor="end" font-weight="600">Scheduler</text>
<path d="M561.7,473.7 L269.3,378.7" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect class="bg" x="385.5" y="415.2" width="60" height="20" rx="10" stroke="#cf222e"/>
<text x="415.5" y="430.2" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">−0.77</text>
<path d="M450.0,510.0 L269.3,261.3" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="6 4"/>
<rect class="bg" x="329.6" y="374.6" width="60" height="20" rx="10" stroke="#cf222e"/>
<text x="359.6" y="389.6" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">−0.68</text>
<text class="t3" x="24.0" y="586.0" font-size="11" text-anchor="start">Numbers are correlations across the 22 frameworks' scores; they describe this coding only.</text>
</svg>