<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title>Where an agent task's money goes: tokens and dollars tell different stories</title>
<rect class="bg" width="920" height="640" rx="8"/>
<text class="t1" x="24" y="32" font-size="18" font-weight="600">Where an agent task's money goes: tokens and dollars tell different stories</text>
<text class="t2" x="24" y="54" font-size="12.5">Top: what one coding-agent session looks like. Bottom: share of tokens vs share of dollars for the same tasks</text>
<text class="t1" x="40.0" y="98.0" font-size="12" text-anchor="start" font-weight="700">One session (illustrative, AgentX public-subset medians): ~43 turns, each reading ~142K tokens and writing ~444</text>
