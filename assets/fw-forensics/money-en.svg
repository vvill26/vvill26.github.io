<rect x="612" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="650" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="664" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="664" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<rect x="702" y="130" width="14" height="10" fill="#d0cec6"/>
<rect x="716" y="112" width="38" height="46" rx="3" fill="#7f8fa6" fill-opacity="0.35"/>
<rect x="716" y="160" width="38" height="4" rx="1" fill="#eb6834"/>
<text class="t2" x="774.0" y="142.0" font-size="18" text-anchor="start">…</text>
<text class="t2" x="40.0" y="188.0" font-size="11" text-anchor="start">Grey: context read (mostly cache hits)  Orange: tokens written  Light: tool waits (median 3.84 s, ~1 in 10 over a minute)</text>
<text x="40" y="208" font-size="11.5" font-weight="700" fill="#cf222e">Red: cache broken during a tool wait; the prefix is billed again as a cache write, about 25–40 cache reads of cost</text>
<text class="t1" x="40.0" y="258.0" font-size="12" text-anchor="start" font-weight="700">Five selected SWE-bench Verified tasks (Kimi K3, list prices, low thinking effort)</text>
<text class="t1" x="40.0" y="316.0" font-size="13" text-anchor="start" font-weight="700">share of tokens</text>
<rect x="170.0" y="286" width="44.9" height="46" fill="#7f8fa6" fill-opacity=".85"/>
<text class="t1" x="192.4" y="282.0" font-size="11" text-anchor="middle" font-weight="700">6.6%</text>
<rect x="214.9" y="286" width="611.3" height="46" fill="#2a78d6" fill-opacity=".85"/>
<text x="520.5" y="306" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">89.9%</text>
<text x="520.5" y="322" font-size="10.5" fill="#fff" text-anchor="middle">cached input</text>
<rect x="826.2" y="286" width="24.5" height="46" fill="#eb6834" fill-opacity=".85"/>
<text class="t1" x="838.4" y="282.0" font-size="11" text-anchor="middle" font-weight="700">3.6%</text>
<text class="t1" x="40.0" y="392.0" font-size="13" text-anchor="start" font-weight="700">share of dollars</text>
<rect x="170.0" y="362" width="133.3" height="46" fill="#7f8fa6" fill-opacity=".85"/>
<text x="236.6" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">19.6%</text>
<text x="236.6" y="398" font-size="10.5" fill="#fff" text-anchor="middle">fresh input</text>
<rect x="303.3" y="362" width="182.2" height="46" fill="#2a78d6" fill-opacity=".85"/>
<text x="394.4" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">26.8%</text>
<text x="394.4" y="398" font-size="10.5" fill="#fff" text-anchor="middle">cached input</text>
<rect x="485.5" y="362" width="364.5" height="46" fill="#eb6834" fill-opacity=".85"/>
<text x="667.8" y="382" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">53.6%</text>
<text x="667.8" y="398" font-size="10.5" fill="#fff" text-anchor="middle">output</text>
<path d="M826.2,332 L485.5,362" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<path d="M850.0,332 L850.0,362" stroke="#eb6834" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<rect class="soft" x="40.0" y="450.0" width="840.0" height="140.0" rx="7"/>
<text class="t1" x="58.0" y="478.0" font-size="12.5" text-anchor="start" font-weight="600">Read a lot, write a little: output is ~3% of tokens but over half the dollars; cached input is ~90% of tokens but a quarter of the dollars.</text>
<text class="t1" x="58.0" y="514.0" font-size="12.5" text-anchor="start" font-weight="600">So the bill depends heavily on whether the cache survives tool waits, not only on tokens per second.</text>
<text class="t2" x="58.0" y="550.0" font-size="11.5" text-anchor="start">Same paper: median cost $0.11–$1.16 per run; cache hit rate 96.3%.</text>
<text class="t3" x="24.0" y="610.0" font-size="10.5" text-anchor="start">Sources: SemiAnalysis AgentX (session medians); Smékal, arXiv 2608.25399, Table E1 (token vs dollar shares); CONCUR, arXiv 2601.22705 (recompute share of latency).</text>
<text class="t3" x="24.0" y="626.0" font-size="10.5" text-anchor="start">"25–40 cache reads" (25x for a 5-minute write, 40x for 1 hour) is this post's estimate at cache reads of 5% and writes of 125–200% of input price; shares depend on prices and caching. The session strip is illustrative.</text>
</svg>