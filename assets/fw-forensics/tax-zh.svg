<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" class="s" role="img" aria-label="静态形状的税，一张图">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#8a8984}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.lnd{stroke:#9b9a95;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.soft{fill:#f3f2ef}.lane{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.m3{fill:#1baf7a}.m4{fill:#8a63d2}.m5{fill:#7f8fa6}.m6{fill:#b5b0a2}
.b1{fill:#2a78d6;fill-opacity:.12;stroke:#2a78d6;stroke-width:1.3}.b2{fill:#eb6834;fill-opacity:.12;stroke:#eb6834;stroke-width:1.3}
.b3{fill:#1baf7a;fill-opacity:.12;stroke:#1baf7a;stroke-width:1.3}.b5{fill:#7f8fa6;fill-opacity:.12;stroke:#7f8fa6;stroke-width:1.3}
.ah{fill:#9b9a95}.yr{stroke:#e3e1da;stroke-width:1}.hl{fill:#eb6834;fill-opacity:.07}
@media (prefers-color-scheme:dark){.bg,.box{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.soft,.lane{fill:#242422}
.ln,.lnd,.box{stroke:#6d6c66}.ah{fill:#6d6c66}.yr{stroke:#2e2e2b}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{fill:#d95926;fill-opacity:.10}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title>静态形状的税，一张图</title>
<rect class="bg" width="900" height="470" rx="8"/>
<text class="t1" x="24" y="32" font-size="18" font-weight="600">静态形状的税，一张图</text>
<text class="t2" x="24" y="54" font-size="12.5">同样 5 个请求，左边是动态引擎，右边是按形状分桶的编译型芯片</text>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#cf222e" stroke-width="2" stroke-opacity=".45"/></pattern></defs>
<text class="t1" x="40.0" y="96.0" font-size="13" text-anchor="start" font-weight="700">动态引擎：连续批处理，按实际长度</text>
<rect x="40" y="112" width="186" height="24" rx="4" fill="#2a78d6" fill-opacity=".55"/>
<text class="t2" x="232.0" y="128.0" font-size="10.5" text-anchor="start">300</text>
<rect x="40" y="146" width="74" height="24" rx="4" fill="#2a78d6" fill-opacity=".55"/>
<text class="t2" x="120.4" y="162.0" font-size="10.5" text-anchor="start">120</text>
<rect x="40" y="180" width="285" height="24" rx="4" fill="#2a78d6" fill-opacity=".55"/>
<text class="t2" x="331.2" y="196.0" font-size="10.5" text-anchor="start">460</text>
<rect x="40" y="214" width="37" height="24" rx="4" fill="#2a78d6" fill-opacity=".55"/>
<text class="t2" x="83.2" y="230.0" font-size="10.5" text-anchor="start">60</text>
<rect x="40" y="248" width="136" height="24" rx="4" fill="#2a78d6" fill-opacity=".55"/>
<text class="t2" x="182.4" y="264.0" font-size="10.5" text-anchor="start">220</text>
<text class="t2" x="40.0" y="300.0" font-size="11.5" text-anchor="start">prefill 和 decode 可以混在一个 batch 里</text>
<text class="t2" x="40.0" y="318.0" font-size="11.5" text-anchor="start">前缀缓存按块（例如 16 token）命中</text>
<text class="t1" x="470.0" y="96.0" font-size="13" text-anchor="start" font-weight="700">编译型芯片：只有 128 / 256 / 512 几个桶</text>
<rect x="470" y="112" width="186" height="24" rx="4" fill="#eb6834" fill-opacity=".6"/>
<rect x="656" y="112" width="131" height="24" fill="url(#hatch)" stroke="#cf222e" stroke-opacity=".4"/>
<text class="t2" x="793.4" y="128.0" font-size="10.5" text-anchor="start">桶 512</text>
<rect x="470" y="146" width="74" height="24" rx="4" fill="#eb6834" fill-opacity=".6"/>
<rect x="544" y="146" width="5" height="24" fill="url(#hatch)" stroke="#cf222e" stroke-opacity=".4"/>
<text class="t2" x="555.4" y="162.0" font-size="10.5" text-anchor="start">桶 128</text>
<rect x="470" y="180" width="285" height="24" rx="4" fill="#eb6834" fill-opacity=".6"/>
<rect x="755" y="180" width="32" height="24" fill="url(#hatch)" stroke="#cf222e" stroke-opacity=".4"/>
<text class="t2" x="793.4" y="196.0" font-size="10.5" text-anchor="start">桶 512</text>
<rect x="470" y="214" width="37" height="24" rx="4" fill="#eb6834" fill-opacity=".6"/>
<rect x="507" y="214" width="42" height="24" fill="url(#hatch)" stroke="#cf222e" stroke-opacity=".4"/>
<text class="t2" x="555.4" y="230.0" font-size="10.5" text-anchor="start">桶 128</text>
<rect x="470" y="248" width="136" height="24" rx="4" fill="#eb6834" fill-opacity=".6"/>
<rect x="606" y="248" width="22" height="24" fill="url(#hatch)" stroke="#cf222e" stroke-opacity=".4"/>
<text class="t2" x="634.7" y="264.0" font-size="10.5" text-anchor="start">桶 256</text>
<text class="t2" x="470.0" y="300.0" font-size="11.5" text-anchor="start">斜线 = 补齐的空位：这 5 个请求里占 24%</text>
<text class="t2" x="470.0" y="318.0" font-size="11.5" text-anchor="start">prefill 和 decode 分开批；缓存只认整块</text>
<rect class="soft" x="40.0" y="344.0" width="820.0" height="86.0" rx="7"/>
<text class="t1" x="58.0" y="372.0" font-size="12" text-anchor="start" font-weight="600">六项税：形状分桶 · prefill/decode 不能同批 · 前缀缓存变粗 · 调度器要重写 · 图外功能被丢掉 · 插件落后上游</text>
<text class="t2" x="58.0" y="398.0" font-size="12" text-anchor="start">例子：IBM Spyre（固定 chunk、替换调度器）、AWS Neuron（按桶编译）、昇腾实地研究（12 个补丁）、端侧 NPU（固定上下文）</text>
<text class="t3" x="24.0" y="456.0" font-size="11" text-anchor="start">示意图：请求长度与桶大小为举例，不是某一颗芯片的实际配置。</text>
</svg>