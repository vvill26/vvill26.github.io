<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}
.dash{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}.soft{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.ah{fill:#9b9a95}.hl{fill:none;stroke:#eb6834;stroke-width:2}
@media (prefers-color-scheme:dark){.bg,.box,.dash{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.soft{fill:#242422}
.ln,.box,.dash{stroke:#6d6c66}.ah{fill:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{stroke:#d95926}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title id="t">Chip software in the AI era: a three-part series</title><desc id="d">Part 1: The hard part; Part 2: Brain and hands; Part 3: Agent infrastructure</desc>
<rect class="bg" width="720" height="270" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">Chip software in the AI era: a three-part series</text>
<text class="t2" x="56" y="54" font-size="12.5">From one engineering decision, to a new way of working, to the infrastructure behind it</text>
<rect class="m1" x="56" y="82" width="176" height="150" rx="10"/>
<text class="w" x="72" y="106" font-size="11.5" text-anchor="start" font-weight="600">Part 1</text>
<text class="w" x="72" y="130" font-size="15" text-anchor="start" font-weight="600">The hard part</text>
<text class="w" x="72" y="158" font-size="11.5" text-anchor="start">When a big swing beats</text>
<text class="w" x="72" y="175" font-size="11.5" text-anchor="start">the safe path</text>
<line x1="72" y1="192" x2="216" y2="192" stroke="#ffffff" stroke-opacity=".5"/>
<text class="w" x="72" y="214" font-size="11" text-anchor="start">Stripe and Anthropic</text>
<path class="ln" d="M236,157 H268" marker-end="url(#ar)"/>
<rect class="box" x="272" y="82" width="176" height="150" rx="10"/>
<text class="t2" x="288" y="106" font-size="11.5" text-anchor="start" font-weight="600">Part 2</text>
<text class="t1" x="288" y="130" font-size="15" text-anchor="start" font-weight="600">Brain and hands</text>
<text class="t2" x="288" y="158" font-size="11.5" text-anchor="start">Humans own spec and proof;</text>
<text class="t2" x="288" y="175" font-size="11.5" text-anchor="start">AI writes the code</text>
<line class="ln" x1="288" y1="192" x2="432" y2="192" style="stroke-opacity:.5"/>
<text class="t2" x="288" y="214" font-size="11" text-anchor="start">Compilers and tooling</text>
<path class="ln" d="M452,157 H484" marker-end="url(#ar)"/>
<rect class="box" x="488" y="82" width="176" height="150" rx="10"/>
<text class="t2" x="504" y="106" font-size="11.5" text-anchor="start" font-weight="600">Part 3</text>
<text class="t1" x="504" y="130" font-size="15" text-anchor="start" font-weight="600">Agent infrastructure</text>
<text class="t2" x="504" y="158" font-size="11.5" text-anchor="start">What a chip startup could</text>
<text class="t2" x="504" y="175" font-size="11.5" text-anchor="start">build, and at what cost</text>
<line class="ln" x1="504" y1="192" x2="648" y2="192" style="stroke-opacity:.5"/>
<text class="t2" x="504" y="214" font-size="11" text-anchor="start">A discussion, not a report</text>
<text class="w" x="216" y="106" font-size="10.5" text-anchor="end">You are here</text>
<text class="t2" x="56" y="256" font-size="11" text-anchor="start">Each part stands alone; together they move from why, to how, to what it would take.</text>
</svg>