<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}
.dash{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}.soft{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.ah{fill:#9b9a95}.hl{fill:none;stroke:#eb6834;stroke-width:2}
@media (prefers-color-scheme:dark){.bg,.box,.dash{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.soft{fill:#242422}
.ln,.box,.dash{stroke:#6d6c66}.ah{fill:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{stroke:#d95926}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title id="t">AI 时代的芯片软件：三篇系列</title><desc id="d">第一篇: 绕不开的硬骨头; 第二篇: 大脑与双手; 第三篇: agent 基础设施</desc>
<rect class="bg" width="720" height="270" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">AI 时代的芯片软件：三篇系列</text>
<text class="t2" x="56" y="54" font-size="12.5">从一次工程决策，到一种新的工作方式，再到背后的基础设施</text>
<rect class="m1" x="56" y="82" width="176" height="150" rx="10"/>
<text class="w" x="72" y="106" font-size="11.5" text-anchor="start" font-weight="600">第一篇</text>
<text class="w" x="72" y="130" font-size="15" text-anchor="start" font-weight="600">绕不开的硬骨头</text>
<text class="w" x="72" y="158" font-size="11.5" text-anchor="start">什么时候该放弃稳妥路线，</text>
<text class="w" x="72" y="175" font-size="11.5" text-anchor="start">正面硬啃</text>
<line x1="72" y1="192" x2="216" y2="192" stroke="#ffffff" stroke-opacity=".5"/>
<text class="w" x="72" y="214" font-size="11" text-anchor="start">Stripe 和 Anthropic 的两次选择</text>
<path class="ln" d="M236,157 H268" marker-end="url(#ar)"/>
<rect class="box" x="272" y="82" width="176" height="150" rx="10"/>
<text class="t2" x="288" y="106" font-size="11.5" text-anchor="start" font-weight="600">第二篇</text>
<text class="t1" x="288" y="130" font-size="15" text-anchor="start" font-weight="600">大脑与双手</text>
<text class="t2" x="288" y="158" font-size="11.5" text-anchor="start">人负责定标准、做证明，</text>
<text class="t2" x="288" y="175" font-size="11.5" text-anchor="start">AI 负责写代码</text>
<line class="ln" x1="288" y1="192" x2="432" y2="192" style="stroke-opacity:.5"/>
<text class="t2" x="288" y="214" font-size="11" text-anchor="start">对编译器和工具链的启发</text>
<path class="ln" d="M452,157 H484" marker-end="url(#ar)"/>
<rect class="box" x="488" y="82" width="176" height="150" rx="10"/>
<text class="t2" x="504" y="106" font-size="11.5" text-anchor="start" font-weight="600">第三篇</text>
<text class="t1" x="504" y="130" font-size="15" text-anchor="start" font-weight="600">agent 基础设施</text>
<text class="t2" x="504" y="158" font-size="11.5" text-anchor="start">芯片初创公司可以建什么，</text>
<text class="t2" x="504" y="175" font-size="11.5" text-anchor="start">大概要花多少钱</text>
<line class="ln" x1="504" y1="192" x2="648" y2="192" style="stroke-opacity:.5"/>
<text class="t2" x="504" y="214" font-size="11" text-anchor="start">一次讨论，不是现状汇报</text>
<text class="w" x="216" y="106" font-size="10.5" text-anchor="end">本篇</text>
<text class="t2" x="56" y="256" font-size="11" text-anchor="start">三篇可以单独读；连起来看，是从“为什么”到“怎么做”，再到“需要什么”。</text>
</svg>