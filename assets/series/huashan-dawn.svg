<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
<title id="t">One path up the mountain</title>
<desc id="d">Before dawn, a lone climber with a lantern stands at the foot of a steep stairway cut into a granite cliff. The path behind has crumbled into fog. Far above, the first light of sunrise touches the summit.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0a1128"/><stop offset="0.45" stop-color="#27315f"/><stop offset="0.72" stop-color="#7a4f72"/><stop offset="0.9" stop-color="#e48a5a"/><stop offset="1" stop-color="#f6c27a"/>
</linearGradient>
<radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c4" stop-opacity="1"/><stop offset="0.35" stop-color="#ffcf7a" stop-opacity="0.75"/><stop offset="1" stop-color="#ff9a5a" stop-opacity="0"/></radialGradient>
<radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/><stop offset="0.3" stop-color="#ffc861" stop-opacity="0.45"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a3150"/><stop offset="1" stop-color="#0f1426"/></linearGradient>
<linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd6ea" stop-opacity="0"/><stop offset="1" stop-color="#cfd6ea" stop-opacity="0.55"/></linearGradient>
</defs>
<rect width="720" height="400" rx="8" fill="url(#sky)"/>
<!-- stars -->
<g fill="#ffffff">
<circle cx="40" cy="30" r="1.1" opacity=".9"/><circle cx="96" cy="64" r=".8" opacity=".7"/><circle cx="150" cy="22" r="1" opacity=".8"/><circle cx="212" cy="50" r=".7" opacity=".6"/><circle cx="260" cy="18" r="1.2" opacity=".9"/><circle cx="330" cy="40" r=".8" opacity=".6"/><circle cx="590" cy="26" r="1" opacity=".8"/><circle cx="640" cy="58" r=".8" opacity=".6"/><circle cx="690" cy="20" r="1.1" opacity=".85"/><circle cx="548" cy="70" r=".7" opacity=".5"/><circle cx="70" cy="110" r=".7" opacity=".5"/><circle cx="660" cy="104" r=".7" opacity=".4"/>
</g>
<!-- sunrise glow behind the summit -->
<circle cx="476" cy="96" r="120" fill="url(#sun)"/>
<!-- distant ridges -->
<path d="M0,250 L80,200 L140,226 L210,170 L280,214 L340,190 L400,236 L470,210 L540,180 L620,214 L720,186 L720,400 L0,400 Z" fill="#3a3f6e" opacity=".55"/>
<path d="M0,292 L60,262 L130,282 L190,250 L250,284 L330,264 L420,300 L520,270 L600,292 L720,262 L720,400 L0,400 Z" fill="#2a2f57" opacity=".7"/>
<!-- main peak -->
<path d="M200,400 L300,330 L350,250 L392,200 L420,150 L446,118 L468,92 L486,96 L510,128 L548,170 L600,230 L660,300 L720,330 L720,400 Z" fill="url(#rock)"/>
<!-- cliff texture -->
<g stroke="#4a5582" stroke-width="1" fill="none" opacity=".55">
<path d="M470,100 L462,150 L470,210 L458,270"/><path d="M500,130 L494,190 L506,250"/><path d="M430,150 L436,200 L424,260"/><path d="M540,175 L534,240"/>
</g>
<!-- rim light on the summit -->
<path d="M446,118 L468,92 L486,96 L510,128" fill="none" stroke="#ffd59a" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
<!-- the stairway cut into the cliff -->
<path id="stair" d="M318,356 L350,330 L340,312 L376,290 L366,270 L398,248 L390,228 L420,206 L412,186 L440,164 L434,146 L458,124 L466,104" fill="none" stroke="#c9b48e" stroke-width="2.4" stroke-linejoin="round" opacity=".85"/>
<g stroke="#e8d6b0" stroke-width="1.2" opacity=".75">
<path d="M326,350 l8,0"/><path d="M336,342 l8,0"/><path d="M344,322 l8,0"/><path d="M356,302 l8,0"/><path d="M370,284 l8,0"/><path d="M374,264 l8,0"/><path d="M386,256 l8,0"/><path d="M396,236 l8,0"/><path d="M404,220 l8,0"/><path d="M416,196 l8,0"/><path d="M426,178 l8,0"/><path d="M436,156 l8,0"/><path d="M446,138 l8,0"/><path d="M458,118 l6,0"/>
</g>
<!-- iron chain railing -->
<path d="M324,348 L356,324 L346,306 L382,284 L372,264 L404,242 L396,222 L426,200 L418,180 L446,158 L440,140 L462,118" fill="none" stroke="#9aa3c6" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>
<!-- crumbled path behind the climber, falling into fog -->
<path d="M150,372 L210,366 L236,370" fill="none" stroke="#8a8fb0" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
<g fill="#6d7397" opacity=".7"><path d="M246,372 l6,-3 l4,5 l-7,3 z"/><path d="M262,380 l5,-2 l3,4 l-6,2 z"/><path d="M252,392 l4,-2 l2,3 l-4,2 z"/></g>
<rect x="0" y="330" width="720" height="70" fill="url(#fog)"/>
<!-- ledge the climber stands on -->
<path d="M270,372 L330,358 L344,366 L300,378 Z" fill="#1b2140"/>
<!-- lantern glow -->
<circle cx="312" cy="340" r="44" fill="url(#lamp)"/>
<!-- climber silhouette -->
<g fill="#0a0d1c">
<circle cx="300" cy="330" r="5.2"/>
<path d="M294,336 L306,336 L308,356 L304,368 L300,368 L300,356 L298,368 L294,368 L295,354 Z"/>
<path d="M291,337 L296,337 L297,352 L289,350 Z"/>
<path d="M306,339 L314,344 L313,347 L305,343 Z"/>
</g>
<circle cx="315" cy="346" r="2.6" fill="#fff1c0"/>
<path d="M315,343 L315,338" stroke="#0a0d1c" stroke-width="1"/>
</svg>
