<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.dash{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.soft{fill:#f3f2ef}
@media (prefers-color-scheme:dark){.bg,.box,.dash{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.soft{fill:#242422}
.ln,.box,.dash{stroke:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}}
</style>
<title id="t">芯片初创公司的起步架构</title>
<desc id="d">入口: GitHub · 飞书 → 工单 · 白名单 · 观察模式. 大脑: harness（托管或开源）; 会话日志: 只追加，全员共享. execute(name, input) · 凭据代理 · 出站白名单. 双手（可销毁的沙箱）: 编译器, 功能模拟器, 周期模型, 参考 GPU, FPGA / 仿真, 芯片. 评测 与接口契约.</desc>
<rect class="bg" width="720" height="380" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">芯片初创公司的起步架构</text>
<text class="t2" x="56" y="54" font-size="12.5">工作流思路借鉴 DeepSeek 原型，运行时思路借鉴 Managed Agents</text>
<rect class="box" x="56" y="74" width="530" height="40" rx="7"/>
<text class="t1" x="72" y="99" font-size="13" font-weight="600">入口</text>
<text class="t2" x="150" y="99" font-size="12">GitHub · 飞书 → 工单 · 白名单 · 观察模式</text>
<path class="ln" d="M321,114 V128"/>
<rect class="box" x="56" y="128" width="300" height="48" rx="7"/>
<text class="t1" x="72" y="149" font-size="13" font-weight="600">大脑</text>
<text class="t2" x="72" y="167" font-size="12">harness（托管或开源）</text>
<rect class="m1" x="372" y="128" width="214" height="48" rx="7"/>
<text class="w" x="388" y="149" font-size="13" font-weight="600">会话日志</text>
<text class="w" x="388" y="167" font-size="12">只追加，全员共享</text>
<path class="ln" d="M356,152 H370"/>
<path class="ln" d="M206,176 V190"/>
<rect class="m1" x="56" y="190" width="530" height="34" rx="7"/>
<text class="w" x="321" y="212" font-size="12.5" text-anchor="middle">execute(name, input) · 凭据代理 · 出站白名单</text>
<path class="ln" d="M321,224 V238"/>
<rect class="soft" x="56" y="238" width="530" height="96" rx="8"/>
<text class="t1" x="72" y="258" font-size="12.5" font-weight="600">双手（可销毁的沙箱）</text>
<rect class="box" x="72" y="270" width="78" height="36" rx="6"/><text class="t1" x="111.0" y="292" font-size="11.5" text-anchor="middle">编译器</text>
<rect class="box" x="158" y="270" width="78" height="36" rx="6"/><text class="t1" x="197.0" y="292" font-size="11.5" text-anchor="middle">功能模拟器</text>
<rect class="box" x="244" y="270" width="78" height="36" rx="6"/><text class="t1" x="283.0" y="292" font-size="11.5" text-anchor="middle">周期模型</text>
<rect class="box" x="330" y="270" width="78" height="36" rx="6"/><text class="t1" x="369.0" y="292" font-size="11.5" text-anchor="middle">参考 GPU</text>
<rect class="m2" x="416" y="270" width="78" height="36" rx="6"/><text class="w" x="455.0" y="292" font-size="11.5" text-anchor="middle">FPGA / 仿真</text><text class="t2" x="455.0" y="322" font-size="10.5" text-anchor="middle">排队</text>
<rect class="dash" x="502" y="270" width="78" height="36" rx="6"/><text class="t1" x="541.0" y="292" font-size="11.5" text-anchor="middle">芯片</text><text class="t2" x="541.0" y="322" font-size="10.5" text-anchor="middle">流片回来后</text>
<rect class="m1" x="604" y="74" width="92" height="260" rx="8"/>
<text class="w" x="650" y="196" font-size="13" font-weight="600" text-anchor="middle">评测</text>
<text class="w" x="650" y="214" font-size="11.5" text-anchor="middle">与接口契约</text>
<text class="t2" x="56" y="362" font-size="11">示意图。蓝色 = 自己掌握的接口；橙色 = 稀缺资源；虚线 = 首批芯片回来后接入。</text></svg>