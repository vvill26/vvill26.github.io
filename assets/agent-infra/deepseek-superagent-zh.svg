<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}
.dash{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}.soft{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.ah{fill:#9b9a95}.hl{fill:none;stroke:#eb6834;stroke-width:2}
@media (prefers-color-scheme:dark){.bg,.box,.dash{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.soft{fill:#242422}
.ln,.box,.dash{stroke:#6d6c66}.ah{fill:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{stroke:#d95926}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title id="t">DeepSeek dsh-superagent：团队工作流这一层</title><desc id="d">入口 → 评估 + policy → 工单 → 执行会话 → 原地回复</desc>
<rect class="bg" width="720" height="330" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">DeepSeek dsh-superagent：团队工作流这一层</text>
<text class="t2" x="56" y="54" font-size="12.5">接什么活、替谁干、什么时候叫人</text>
<rect class="box" x="56" y="90" width="104" height="64" rx="7"/>
<text class="t1" x="108" y="116" font-size="13" text-anchor="middle" font-weight="600">入口</text>
<text class="t2" x="108" y="136" font-size="11" text-anchor="middle">GitHub · 飞书</text>
<rect class="m2" x="184" y="82" width="150" height="80" rx="7"/>
<text class="w" x="259" y="104" font-size="13" text-anchor="middle" font-weight="600">评估 + policy</text>
<text class="w" x="259" y="124" font-size="11" text-anchor="middle">白名单 · 成文规则</text>
<text class="w" x="259" y="142" font-size="10.5" text-anchor="middle">模式：off / 观察 / 自动</text>
<rect class="box" x="358" y="90" width="104" height="64" rx="7"/>
<text class="t1" x="410" y="114" font-size="13" text-anchor="middle" font-weight="600">工单</text>
<text class="t2" x="410" y="134" font-size="10.5" text-anchor="middle">mandate：</text><text class="t2" x="410" y="147" font-size="10.5" text-anchor="middle">范围 + 理由</text>
<rect class="m1" x="486" y="82" width="178" height="80" rx="7"/>
<text class="w" x="575" y="104" font-size="13" text-anchor="middle" font-weight="600">执行会话</text>
<text class="w" x="575" y="124" font-size="11" text-anchor="middle">每个工单一个，独立 worktree</text>
<text class="w" x="575" y="142" font-size="10.5" text-anchor="middle">worker 槽位，留一个给人</text>
<path class="ln" d="M160,122 H182" marker-end="url(#ar)"/>
<path class="ln" d="M334,122 H356" marker-end="url(#ar)"/>
<path class="ln" d="M462,122 H484" marker-end="url(#ar)"/>
<path class="ln" d="M259,162 V190" marker-end="url(#ar)"/>
<rect class="dash" x="194" y="190" width="130" height="40" rx="7"/>
<text class="t2" x="259" y="207" font-size="10.5" text-anchor="middle">忽略，或记为</text>
<text class="t2" x="259" y="222" font-size="10.5" text-anchor="middle">“本会接受”</text>
<path class="ln" d="M575,162 V190" marker-end="url(#ar)"/>
<rect class="box" x="510" y="190" width="130" height="40" rx="7"/>
<text class="t1" x="575" y="207" font-size="12" text-anchor="middle" font-weight="600">原地回复</text>
<text class="t2" x="575" y="222" font-size="10.5" text-anchor="middle">PR · 评论 · 提问</text>

<rect class="soft" x="56" y="248" width="608" height="26" rx="6"/>
<text class="t1" x="72" y="265" font-size="11.5" text-anchor="start">存储（SQLite）：动作先落盘再执行，重启后接着干</text>
<text class="t2" x="56" y="296" font-size="11.5" text-anchor="start">隔离：以运维者的系统用户、完整权限运行；建议使用专用账户</text>
<text class="t2" x="56" y="318" font-size="11" text-anchor="start">依据 dsh-superagent 原型文档（MIT 许可，研究原型）。</text>
</svg>