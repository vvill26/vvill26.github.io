<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}
.dash{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}.soft{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.ah{fill:#9b9a95}.hl{fill:none;stroke:#eb6834;stroke-width:2}
@media (prefers-color-scheme:dark){.bg,.box,.dash{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.soft{fill:#242422}
.ln,.box,.dash{stroke:#6d6c66}.ah{fill:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{stroke:#d95926}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title id="t">DeepSeek dsh-superagent: the team-workflow layer</title><desc id="d">Sources → Eval + Policy → Ticket → Executor sessions → Reply in place</desc>
<rect class="bg" width="720" height="330" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">DeepSeek dsh-superagent: the team-workflow layer</text>
<text class="t2" x="56" y="54" font-size="12.5">Which work to accept, for whom, and when to involve a person</text>
<rect class="box" x="56" y="90" width="104" height="64" rx="7"/>
<text class="t1" x="108" y="116" font-size="13" text-anchor="middle" font-weight="600">Sources</text>
<text class="t2" x="108" y="136" font-size="11" text-anchor="middle">GitHub · Feishu</text>
<rect class="m2" x="184" y="82" width="150" height="80" rx="7"/>
<text class="w" x="259" y="104" font-size="13" text-anchor="middle" font-weight="600">Eval + Policy</text>
<text class="w" x="259" y="124" font-size="11" text-anchor="middle">allowed list · rules</text>
<text class="w" x="259" y="142" font-size="10.5" text-anchor="middle">mode: off / observe / auto</text>
<rect class="box" x="358" y="90" width="104" height="64" rx="7"/>
<text class="t1" x="410" y="114" font-size="13" text-anchor="middle" font-weight="600">Ticket</text>
<text class="t2" x="410" y="134" font-size="10.5" text-anchor="middle">mandate:</text><text class="t2" x="410" y="147" font-size="10.5" text-anchor="middle">scope + reason</text>
<rect class="m1" x="486" y="82" width="178" height="80" rx="7"/>
<text class="w" x="575" y="104" font-size="13" text-anchor="middle" font-weight="600">Executor sessions</text>
<text class="w" x="575" y="124" font-size="11" text-anchor="middle">one per ticket, own worktree</text>
<text class="w" x="575" y="142" font-size="10.5" text-anchor="middle">worker slots, 1 kept for people</text>
<path class="ln" d="M160,122 H182" marker-end="url(#ar)"/>
<path class="ln" d="M334,122 H356" marker-end="url(#ar)"/>
<path class="ln" d="M462,122 H484" marker-end="url(#ar)"/>
<path class="ln" d="M259,162 V190" marker-end="url(#ar)"/>
<rect class="dash" x="194" y="190" width="130" height="40" rx="7"/>
<text class="t2" x="259" y="207" font-size="10.5" text-anchor="middle">ignored or</text>
<text class="t2" x="259" y="222" font-size="10.5" text-anchor="middle">“would accept”</text>
<path class="ln" d="M575,162 V190" marker-end="url(#ar)"/>
<rect class="box" x="510" y="190" width="130" height="40" rx="7"/>
<text class="t1" x="575" y="207" font-size="12" text-anchor="middle" font-weight="600">Reply in place</text>
<text class="t2" x="575" y="222" font-size="10.5" text-anchor="middle">PR · comment · question</text>

<rect class="soft" x="56" y="248" width="608" height="26" rx="6"/>
<text class="t1" x="72" y="265" font-size="11.5" text-anchor="start">Store (SQLite): actions saved before they run, so a restart resumes cleanly</text>
<text class="t2" x="56" y="296" font-size="11.5" text-anchor="start">Isolation: runs as the operator’s OS user with full access; a dedicated account is advised</text>
<text class="t2" x="56" y="318" font-size="11" text-anchor="start">Based on the dsh-superagent prototype documentation (MIT, research prototype).</text>
</svg>