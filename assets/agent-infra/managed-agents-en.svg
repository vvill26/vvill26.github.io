<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}
.dash{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}.soft{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.ah{fill:#9b9a95}.hl{fill:none;stroke:#eb6834;stroke-width:2}
@media (prefers-color-scheme:dark){.bg,.box,.dash{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.soft{fill:#242422}
.ln,.box,.dash{stroke:#6d6c66}.ah{fill:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{stroke:#d95926}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title id="t">Claude Managed Agents: the runtime layer</title><desc id="d">Brain: Harness, Session log; execute(name, input) → string; Hands: Sandbox, MCP / custom tools; Vault → Proxy</desc>
<rect class="bg" width="720" height="360" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">Claude Managed Agents: the runtime layer</text>
<text class="t2" x="56" y="54" font-size="12.5">Session, harness and sandbox are separate, and each can fail or be replaced on its own</text>
<rect class="soft" x="56" y="78" width="440" height="112" rx="10"/>
<text class="t1" x="72" y="98" font-size="12.5" text-anchor="start" font-weight="600">Brain</text>
<rect class="m1" x="72" y="108" width="200" height="72" rx="7"/>
<text class="w" x="88" y="128" font-size="13" text-anchor="start" font-weight="600">Harness</text>
<text class="w" x="88" y="145" font-size="11" text-anchor="start">Claude + the agent loop</text>
<text class="w" x="88" y="160" font-size="10.5" text-anchor="start">stateless; many can run;</text>
<text class="w" x="88" y="174" font-size="10.5" text-anchor="start">wake(sessionId) after a crash</text>
<rect class="m1" x="296" y="108" width="184" height="72" rx="7"/>
<text class="w" x="312" y="128" font-size="13" text-anchor="start" font-weight="600">Session log</text>
<text class="w" x="312" y="145" font-size="11" text-anchor="start">append-only record of</text>
<text class="w" x="312" y="160" font-size="11" text-anchor="start">every event</text>
<text class="w" x="312" y="174" font-size="10.5" text-anchor="start">emitEvent · getEvents</text>
<path class="ln" d="M272,144 H294" marker-end="url(#ar)" marker-start="url(#ar)"/>
<path class="ln" d="M172,190 V206" marker-end="url(#ar)"/>
<rect class="box" x="56" y="206" width="440" height="30" rx="6"/>
<text class="t1" x="276" y="226" font-size="12" text-anchor="middle" font-weight="600">execute(name, input) → string</text>
<path class="ln" d="M276,236 V252" marker-end="url(#ar)"/>
<rect class="soft" x="56" y="252" width="440" height="72" rx="10"/>
<text class="t1" x="72" y="272" font-size="12.5" text-anchor="start" font-weight="600">Hands</text>
<rect class="box" x="72" y="280" width="200" height="38" rx="7"/>
<text class="t1" x="88" y="296" font-size="12" text-anchor="start" font-weight="600">Sandbox</text>
<text class="t2" x="88" y="311" font-size="10.5" text-anchor="start">on demand; replaced if it fails</text>
<rect class="box" x="296" y="280" width="184" height="38" rx="7"/>
<text class="t1" x="312" y="296" font-size="12" text-anchor="start" font-weight="600">MCP / custom tools</text>
<text class="t2" x="312" y="311" font-size="10.5" text-anchor="start">via a proxy</text>
<rect class="m2" x="520" y="108" width="144" height="60" rx="7"/>
<text class="w" x="536" y="130" font-size="13" text-anchor="start" font-weight="600">Vault</text>
<text class="w" x="536" y="148" font-size="11" text-anchor="start">credentials live here</text>
<path class="ln" d="M592,168 V230" marker-end="url(#ar)"/>
<rect class="box" x="520" y="230" width="144" height="64" rx="7"/>
<text class="t1" x="536" y="250" font-size="13" text-anchor="start" font-weight="600">Proxy</text>
<text class="t2" x="536" y="267" font-size="10.5" text-anchor="start">injects the real key</text>
<text class="t2" x="536" y="282" font-size="10.5" text-anchor="start">on the way out</text>
<path class="ln" d="M520,299 H482" marker-end="url(#ar)"/>
<text class="t2" x="56" y="346" font-size="11" text-anchor="start">Source: Anthropic, “Scaling Managed Agents”. After the split: TTFT −60% at p50, more than −90% at p95.</text>
</svg>