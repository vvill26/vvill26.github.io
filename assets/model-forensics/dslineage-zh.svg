<text class="t3" x="24.0" y="524.0" font-size="10.5" text-anchor="start">绿 ≤7 天，黄 8–30 天，红 &gt;30 天。“第 0 天”常常是分支或镜像，合入主干晚几天。llama.cpp 的 V3.2-Exp = 索引器算子合入日（通用 DSA 支持在 +242 天）。</text>
<text class="t3" x="24.0" y="542.0" font-size="10.5" text-anchor="start">* V3.2-Exp 按 DeepSeek 自己 kernel 的 FP8 布局计；其余按 BF16。V3 的 MLA 在 vLLM 是 +37 天，SGLang 的 MTP 是 +50 天，D 为发布文档 / 教程 / 部署指南；不推断首次能跑。</text>
<text class="t3" x="24.0" y="560.0" font-size="10.5" text-anchor="start">来源：DeepSeek 新闻页与仓库、vLLM / SGLang / TensorRT-LLM / llama.cpp / vllm-ascend 的 git 历史（附录 B）。</text>
<text class="t3" x="24.0" y="575.0" font-size="10.2" text-anchor="start">† 官方所报 HBM 占用比，不是统一 BF16 KB/token；布局与条件不同。</text>
