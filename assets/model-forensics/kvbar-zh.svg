<text class="t1" x="793.9" y="120.0" font-size="11" text-anchor="start">376.8 KB  (46.0 GiB)</text>
<text class="t1" x="286.0" y="149.0" font-size="12.5" text-anchor="end" font-weight="600">Llama-3.1-70B</text>
<text class="t3" x="286.0" y="163.0" font-size="9.5" text-anchor="end">GQA-8, 80 层</text>
<rect x="300" y="140" width="422.5" height="18" rx="3" fill="#7f8fa6" fill-opacity=".8"/>
<text class="t1" x="730.5" y="154.0" font-size="11" text-anchor="start">327.7 KB  (40.0 GiB)</text>
<text class="t1" x="286.0" y="183.0" font-size="12.5" text-anchor="end" font-weight="600">GLM-5.2</text>
<text class="t3" x="286.0" y="197.0" font-size="9.5" text-anchor="end">MLA 主缓存，78 层</text>
