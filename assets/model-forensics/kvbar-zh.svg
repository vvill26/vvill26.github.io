<text class="t3" x="557.9" y="88.0" font-size="10.5" text-anchor="middle">200 KB</text>
<line class="yr" x1="686.8" y1="94" x2="686.8" y2="406"/>
<text class="t3" x="686.8" y="88.0" font-size="10.5" text-anchor="middle">300 KB</text>
