<text class="t1" x="286.0" y="353.0" font-size="12.5" text-anchor="end" font-weight="600">Kimi K3</text>
<text class="t3" x="286.0" y="367.0" font-size="9.5" text-anchor="end">24 MLA；KDA 核心状态另约 414 MiB</text>
<rect x="300" y="344" width="35.7" height="18" rx="3" fill="#8a63d2" fill-opacity=".8"/>
<text class="t1" x="343.7" y="358.0" font-size="11" text-anchor="start">27.6 KB  (3.4 GiB)</text>
<text class="t1" x="286.0" y="387.0" font-size="12.5" text-anchor="end" font-weight="600">DeepSeek-V4-Pro</text>
<text class="t3" x="286.0" y="401.0" font-size="9.5" text-anchor="end">压缩注意力，1 Mi-token 平均量</text>
<rect x="300" y="378" width="12.7" height="18" rx="3" fill="#2a78d6" fill-opacity=".8"/>
<text class="t1" x="320.7" y="392.0" font-size="11" text-anchor="start">9.9 KB*  (9.62 GiB @ 1 Mi)</text>
<text class="t3" x="24.0" y="440.0" font-size="10.5" text-anchor="start">主历史统一 BF16；索引器、窗口和循环状态另计。* V4 是 1 Mi-token 下含状态的平均量，不能当作普遍增量。</text>
<text class="t3" x="24.0" y="458.0" font-size="10.5" text-anchor="start">计算脚本 shape.py，配置与来源在 configs.json。</text>
</svg>