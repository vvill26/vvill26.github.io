<text class="t1" x="423.9" y="188.0" font-size="11" text-anchor="start">89.9 KB  (11.0 GiB)</text>
<text class="t1" x="286.0" y="217.0" font-size="12.5" text-anchor="end" font-weight="600">DeepSeek-V3</text>
<text class="t3" x="286.0" y="231.0" font-size="9.5" text-anchor="end">MLA，61 层</text>
<rect x="300" y="208" width="90.6" height="18" rx="3" fill="#2a78d6" fill-opacity=".8"/>
<text class="t1" x="398.6" y="222.0" font-size="11" text-anchor="start">70.3 KB  (8.6 GiB)</text>
<text class="t1" x="286.0" y="251.0" font-size="12.5" text-anchor="end" font-weight="600">Kimi K2 Thinking</text>
<text class="t3" x="286.0" y="265.0" font-size="9.5" text-anchor="end">沿用 V3 骨架</text>
<rect x="300" y="242" width="90.6" height="18" rx="3" fill="#8a63d2" fill-opacity=".8"/>
<text class="t1" x="398.6" y="256.0" font-size="11" text-anchor="start">70.3 KB  (8.6 GiB)</text>
<text class="t1" x="286.0" y="285.0" font-size="12.5" text-anchor="end" font-weight="600">DeepSeek-V3.2</text>
<text class="t3" x="286.0" y="299.0" font-size="9.5" text-anchor="end">BF16 MLA 主缓存；索引器另计</text>
