<text class="t1" x="398.6" y="290.0" font-size="11" text-anchor="start">70.3 KB  (8.6 GiB)</text>
<text class="t1" x="286.0" y="319.0" font-size="12.5" text-anchor="end" font-weight="600">gpt-oss-120b</text>
<text class="t3" x="286.0" y="333.0" font-size="9.5" text-anchor="end">半数层是 128 token 窗口</text>
