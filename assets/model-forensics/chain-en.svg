<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" class="s" role="img" aria-label="The model sits at the top of the chain; detail can thin at company boundaries">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#8a8984}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.lnd{stroke:#9b9a95;stroke-width:1.2;fill:none;stroke-dasharray:4 3}
.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.soft{fill:#f3f2ef}.lane{fill:#f3f2ef}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.m3{fill:#1baf7a}.m4{fill:#8a63d2}.m5{fill:#7f8fa6}.m6{fill:#b5b0a2}
.b1{fill:#2a78d6;fill-opacity:.12;stroke:#2a78d6;stroke-width:1.3}.b2{fill:#eb6834;fill-opacity:.12;stroke:#eb6834;stroke-width:1.3}
.b3{fill:#1baf7a;fill-opacity:.12;stroke:#1baf7a;stroke-width:1.3}.b5{fill:#7f8fa6;fill-opacity:.12;stroke:#7f8fa6;stroke-width:1.3}
.ah{fill:#9b9a95}.yr{stroke:#e3e1da;stroke-width:1}.hl{fill:#eb6834;fill-opacity:.07}
@media (prefers-color-scheme:dark){.bg,.box{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}.t3{fill:#8f8e88}.soft,.lane{fill:#242422}
.ln,.lnd,.box{stroke:#6d6c66}.ah{fill:#6d6c66}.yr{stroke:#2e2e2b}.m1{fill:#3987e5}.m2{fill:#d95926}.hl{fill:#d95926;fill-opacity:.10}}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<title>The model sits at the top of the chain; detail can thin at company boundaries</title>
<rect class="bg" width="960" height="470" rx="8"/>
<text class="t1" x="24" y="32" font-size="18" font-weight="600">The model sits at the top of the chain; detail can thin at company boundaries</text>
<text class="t2" x="24" y="54" font-size="12.5">Two paths, open weights and closed; what each downstream hop actually receives</text>
<text class="t1" x="24.0" y="96.0" font-size="13" text-anchor="start" font-weight="700">Open weights</text>
<text class="t1" x="24.0" y="278.0" font-size="13" text-anchor="start" font-weight="700">Closed (lab-operated example; hosting can also cross companies)</text>
<rect class="b1" x="30.0" y="118.0" width="150.0" height="56.0" rx="7"/>
<text class="t1" x="105.0" y="151.0" font-size="13" text-anchor="middle" font-weight="600">Model lab</text>
<path class="ln" d="M182,146 L212,146" marker-end="url(#ar)"/>
<rect class="box" x="216.0" y="118.0" width="150.0" height="56.0" rx="7"/>
<text class="t1" x="291.0" y="151.0" font-size="13" text-anchor="middle" font-weight="600">Checkpoint</text>
<path class="ln" d="M368,146 L398,146" marker-end="url(#ar)"/>
<rect class="box" x="402.0" y="118.0" width="150.0" height="56.0" rx="7"/>
<text class="t1" x="477.0" y="151.0" font-size="13" text-anchor="middle" font-weight="600">Serving framework</text>
<path class="ln" d="M554,146 L584,146" marker-end="url(#ar)"/>
<rect class="box" x="588.0" y="118.0" width="150.0" height="56.0" rx="7"/>
<text class="t1" x="663.0" y="151.0" font-size="13" text-anchor="middle" font-weight="600">Chip and kernels</text>
<path class="ln" d="M740,146 L770,146" marker-end="url(#ar)"/>
<rect class="box" x="774.0" y="118.0" width="150.0" height="56.0" rx="7"/>
<text class="t1" x="849.0" y="151.0" font-size="13" text-anchor="middle" font-weight="600">Cloud / API</text>
<text class="t2" x="198.0" y="200.0" font-size="10.5" text-anchor="middle">✓ weights, config, report</text>
<text class="t3" x="198.0" y="217.0" font-size="10.5" text-anchor="middle">✗ training data, internal serving recipe</text>
<text class="t2" x="384.0" y="200.0" font-size="10.5" text-anchor="middle">✓ reference code, sometimes kernels</text>
<text class="t3" x="384.0" y="217.0" font-size="10.5" text-anchor="middle">✗ lab kernels may stay private</text>
<text class="t2" x="570.0" y="200.0" font-size="10.5" text-anchor="middle">✓ framework PRs, quant recipes</text>
<text class="t3" x="570.0" y="217.0" font-size="10.5" text-anchor="middle">✗ ports may receive details later</text>
<text class="t2" x="756.0" y="200.0" font-size="10.5" text-anchor="middle">✓ same model, uneven speed and quality</text>
<text class="t3" x="756.0" y="217.0" font-size="10.5" text-anchor="middle">✗ precision and templates can drift</text>
<rect class="b2" x="30.0" y="300.0" width="708.0" height="56.0" rx="7"/>
<text class="t1" x="384.0" y="325.0" font-size="13" text-anchor="middle" font-weight="600">Model decisions concentrated; serving stack and hardware can involve partners</text>
<text class="t2" x="384.0" y="343.0" font-size="11" text-anchor="middle">can reshape the model for a chip, and the chip setup for the model</text>
<rect class="box" x="774.0" y="300.0" width="150.0" height="56.0" rx="7"/>
<text class="t1" x="849.0" y="333.0" font-size="13" text-anchor="middle" font-weight="600">API</text>
<path class="ln" d="M740,328 L770,328" marker-end="url(#ar)"/>
<text class="t2" x="756.0" y="382.0" font-size="10.5" text-anchor="middle">✓ price, context, caching rules</text>
<text class="t3" x="756.0" y="399.0" font-size="10.5" text-anchor="middle">✗ architecture, size, precision</text>
<line class="lnd" x1="198" y1="110" x2="198" y2="182"/>
<line class="lnd" x1="384" y1="110" x2="384" y2="182"/>
<line class="lnd" x1="570" y1="110" x2="570" y2="182"/>
<line class="lnd" x1="756" y1="110" x2="756" y2="182"/>
<line class="lnd" x1="756" y1="292" x2="756" y2="364"/>
<text class="t2" x="24.0" y="448.0" font-size="11.5" text-anchor="start">Dashed lines indicate possible company boundaries. Documentation can restore detail; closed weights do not imply ownership of the whole chain.</text>
</svg>