<title id="t">Von isolierten KI-Werkzeugen zum gemeinsamen Harness</title>
<desc id="d">Isoliert: Compiler, Runtime, Driver, Serving → Integration (Schnittstellen driften · schwer reproduzierbar). Orchestriert: Gemeinsames Harness: Agenten arbeiten hier (Session-Log · Evals · Schnittstellenverträge); Simulatoren · Emulation · FPGA · Pods</desc>
