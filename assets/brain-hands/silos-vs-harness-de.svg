<text class="t1" x="56" y="32" font-size="18" font-weight="600">Von isolierten KI-Werkzeugen zum gemeinsamen Harness</text>
<text class="t2" x="56" y="54" font-size="12.5">Jeder Agent ist allein schnell; die Integration eines großen KI-Pods braucht eine gemeinsame Schicht</text>
