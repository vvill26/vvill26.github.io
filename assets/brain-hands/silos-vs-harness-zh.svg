<title id="t">从各自为战的 AI 工具到共享 harness</title>
<desc id="d">各自为战: 编译器, 运行时, 驱动, 推理服务 → 集成阶段 (接口漂移 · 难以复现). 统一编排: 共享 harness (会话日志 · 评测 · 接口契约); 模拟器 · 硬件仿真 · FPGA · 超节点</desc>
<rect class="bg" width="720" height="330" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">从各自为战的 AI 工具到共享 harness</text>
<text class="t2" x="56" y="54" font-size="12.5">每个工程师的 agent 单兵很快；大规模 AI 超节点的集成需要一个共享层</text>
<line class="sep" x1="372" y1="76" x2="372" y2="296"/>
<text class="t1" x="56" y="88" font-size="13.5" font-weight="600">各自为战</text>
<text class="t1" x="392" y="88" font-size="13.5" font-weight="600">统一编排</text>
<rect class="m2" x="56" y="102" width="68" height="22" rx="5"/><text class="w" x="90.0" y="117" font-size="10.5" text-anchor="middle">独立 agent</text>
<rect class="box" x="56" y="130" width="68" height="36" rx="6"/><text class="t1" x="90.0" y="152" font-size="12" text-anchor="middle">编译器</text>
<path class="ln" stroke-dasharray="3 3" d="M90.0,166 V214"/>
