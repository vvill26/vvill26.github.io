<rect class="m1" x="392" y="158" width="296" height="52" rx="8"/><text class="w" x="540" y="180" font-size="13" font-weight="600" text-anchor="middle">共享 harness：agent 在此协作</text><text class="w" x="540" y="198" font-size="11.5" text-anchor="middle">会话日志 · 评测 · 接口契约</text>
