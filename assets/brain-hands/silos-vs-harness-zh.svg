<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.3;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}.sep{stroke:#e4e3df;stroke-width:1}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.wall{fill:#f3f2ef;stroke:#9b9a95;stroke-width:1.2;stroke-dasharray:4 3}
