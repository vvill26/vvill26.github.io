<rect class="box" x="132" y="130" width="68" height="36" rx="6"/><text class="t1" x="166.0" y="152" font-size="12" text-anchor="middle">运行时</text>
<path class="ln" stroke-dasharray="3 3" d="M166.0,166 V214"/>
<rect class="m2" x="208" y="102" width="68" height="22" rx="5"/><text class="w" x="242.0" y="117" font-size="10.5" text-anchor="middle">独立 agent</text>
<rect class="box" x="208" y="130" width="68" height="36" rx="6"/><text class="t1" x="242.0" y="152" font-size="12" text-anchor="middle">驱动</text>
<path class="ln" stroke-dasharray="3 3" d="M242.0,166 V214"/>
<rect class="m2" x="284" y="102" width="68" height="22" rx="5"/><text class="w" x="318.0" y="117" font-size="10.5" text-anchor="middle">独立 agent</text>
<rect class="box" x="284" y="130" width="68" height="36" rx="6"/><text class="t1" x="318.0" y="152" font-size="12" text-anchor="middle">推理服务</text>
