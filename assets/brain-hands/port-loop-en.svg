<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" class="s" role="img" aria-labelledby="t d">
<style>
.s{font-family:-apple-system,"Segoe UI","PingFang SC","Noto Sans SC","Helvetica Neue",Arial,sans-serif}
.bg{fill:#fcfcfb}.t1{fill:#0b0b0b}.t2{fill:#52514e}.w{fill:#ffffff}
.ln{stroke:#9b9a95;stroke-width:1.5;fill:none}.box{fill:#fcfcfb;stroke:#9b9a95;stroke-width:1.2}
.m1{fill:#2a78d6}.m2{fill:#eb6834}.ah{fill:#9b9a95}
@media (prefers-color-scheme:dark){.bg,.box{fill:#1a1a19}.t1{fill:#f0efec}.t2{fill:#c3c2b7}
.ln,.box{stroke:#6d6c66}.ah{fill:#6d6c66}.m1{fill:#3987e5}.m2{fill:#d95926}}
</style>
<title id="t">Humans as the brain, AI as the hands</title>
<desc id="d">Humans: Architecture · spec · plan → AI: Writes the code → Differential test: Same inputs vs. reference → Cut over gradually; fail → fix; Humans define the reference and the tolerances</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="720" height="290" rx="8"/>
<text class="t1" x="56" y="32" font-size="18" font-weight="600">Humans as the brain, AI as the hands</text>
<text class="t2" x="56" y="54" font-size="12.5">The team’s real output was the plan and the verification loop; the implementation was delegated</text>
<path class="ln" stroke-dasharray="4 4" d="M141,108 V86 H586 V104" marker-end="url(#ar)"/>
<rect class="bg" x="222" y="77" width="284" height="18"/>
<text class="t2" x="364" y="90" font-size="12" text-anchor="middle">Humans define the reference and the tolerances</text>
<rect class="m1" x="56" y="108" width="170" height="64" rx="8"/>
<text class="w" x="141" y="134" font-size="15" font-weight="600" text-anchor="middle">Humans</text>
<text class="w" x="141" y="155" font-size="12" text-anchor="middle">Architecture · spec · plan</text>
<rect class="m2" x="266" y="108" width="170" height="64" rx="8"/>
<text class="w" x="351" y="134" font-size="15" font-weight="600" text-anchor="middle">AI</text>
<text class="w" x="351" y="155" font-size="12" text-anchor="middle">Writes the code</text>
<rect class="box" x="476" y="108" width="220" height="64" rx="8"/>
<text class="t1" x="586" y="134" font-size="15" font-weight="600" text-anchor="middle">Differential test</text>
<text class="t2" x="586" y="155" font-size="12" text-anchor="middle">Same inputs vs. reference</text>
<path class="ln" d="M226,140 H264" marker-end="url(#ar)"/>
<path class="ln" d="M436,140 H474" marker-end="url(#ar)"/>
<path class="ln" d="M530,172 V206 H351 V174" marker-end="url(#ar)"/>
<text class="t2" x="440" y="222" font-size="12" text-anchor="middle">fail → fix</text>
<path class="ln" d="M640,172 V208" marker-end="url(#ar)"/>
<text class="t2" x="650" y="194" font-size="12">pass</text>
<rect class="box" x="566" y="210" width="130" height="34" rx="8"/>
<text class="t1" x="631" y="232" font-size="13" font-weight="600" text-anchor="middle">Cut over gradually</text>
<text class="t2" x="56" y="274" font-size="11">Source: Messages API port, K. Lesse on Latent Space (Oct 27, 2026). Compiler analogue: reference vs. compiled output.</text>
</svg>